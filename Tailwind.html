<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
   <div class="max-w-md mx-auto bg-white shadow-lg  shadow:rounded-xl hover:shadow-xl transition-shadow  p-6 space-y-4">

<header class="w-24 h-24 object-cover rounded-full">
<img src="1781443151530.png" alt="Profile Photo">
</header>

<main>
<section class="text-center space-y-2">
<h2 class="font-bold text-xl gap-4">Atitsogbe Obed</h2>
<p class="text-sm font-medium">Full-stack Development</p>
<p class="text-sm text-gray-500 text-slate-400">Passionate aspiring web developer focused on building clean,structured, and accessible web experiences using modern semantic HTML standard</p>
</section >
<section class="skills">
<ul class="flex flex-wrap justify-center gap-2 my-4">
    <li class="px-3 py-1 rounded-full text-xs bg-blue-100 text-blue-800">Semantics HTML5 and Web Accessibility </li>
    <li class="px-3 py-1 rounded-full text-xs bg-green-100 text-green-800">Responsive Design</li>
    <li class="px-3 py-1 rounded-full text-xs bg-yellow-100 text-yellow-800">Version Control with Git</li>
</ul>
</section>
</main>

<footer class="profile-info">
<button type="button" class="w-full py-2 px-4 hover:bg-blue-100 transition-colors duration-200">Contact Me</button>
</footer>

   </div> 

</body>
</html>
